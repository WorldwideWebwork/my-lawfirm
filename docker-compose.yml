services:
  mariadb:
    image: mariadb:11
    container_name: w4-lawfirm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-docker}
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"

  youmeos:
    image: xengenie/youmeos:latest
    platform: linux/amd64
    container_name: w4-lawfirm
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "${PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./plugins:/var/www/custom-plugins
    environment:
      - PORT=80
      - HTTPS_PORT=443
      - WP_DEBUG=${WP_DEBUG:-false}
      - FS_METHOD=direct
      - WORDPRESS_DB_HOST=mariadb:3306
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_DB_USER=${DB_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD:-wordpress}

  node:
    image: node:20
    container_name: w4-lawfirm-node
    restart: unless-stopped
    working_dir: /workspace/apps/lawfirm
    volumes:
      - ./:/workspace
    ports:
      - "${DEV_PORT:-8090}:8090"
    command: npx vite --host 0.0.0.0 --port 8090

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: w4-lawfirm-pma
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
    ports:
      - "${PMA_PORT:-8080}:80"

volumes:
  db_data: {}
